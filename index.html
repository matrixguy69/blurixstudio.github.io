<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: radial-gradient(ellipse 120% 80% at 50% 75%, #1c232b, #05070a 70%); color: #fff;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .vig { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 110% 100% at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.45)); }
  #cut { position: fixed; inset: 0; background: #000; pointer-events: none; opacity: 1; }

  /* Cinematic bars that slide open. Nothing animates until the 3D scene is ready ("ready" class),
     so the intro never plays while the browser is still busy loading. */
  .bar { position: fixed; left: 0; right: 0; height: 50.5vh; background: #000; z-index: 5; will-change: transform; }
  .bar.top { top: 0; transform-origin: top; } .bar.bot { bottom: 0; transform-origin: bottom; }
  .ready .bar { animation: bars 1.9s cubic-bezier(0.77, 0, 0.18, 1) 0.3s forwards; }
  @keyframes bars { to { transform: scaleY(0); } }   /* opens all the way: full screen, no black edges */

  main { position: fixed; inset: 0; z-index: 6; display: grid; place-items: center; padding: 16px; }
  .dc { display: flex; flex-direction: column; align-items: center; gap: 14px; color: #fff; text-decoration: none; outline: none; }
  .dc .logo { position: relative; display: grid; place-items: center; width: 92px; height: 92px; border-radius: 50%;
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
  /* frosted glass disc behind the logo; turns Discord blue on hover */
  .dc .logo::before { content: ""; position: absolute; inset: 0; border-radius: 50%; opacity: 0;
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.2);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    transition: background 0.45s, border-color 0.45s, box-shadow 0.45s, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
  .ready .dc .logo::before { animation: fade 1s ease 1.6s forwards; }
  @keyframes fade { to { opacity: 1; } }
  /* a soft ring that pulses out every few seconds, inviting a click */
  .dc .logo::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.5); opacity: 0; pointer-events: none; }
  .ready .dc .logo::after { animation: ping 3.2s cubic-bezier(0.16, 1, 0.3, 1) 3.4s infinite; }
  @keyframes ping { 0% { transform: scale(1); opacity: 0.55; } 60%, 100% { transform: scale(1.75); opacity: 0; } }
  .dc:hover .logo::before, .dc:focus-visible .logo::before {
    background: linear-gradient(140deg, #6a76ff, #5865f2 55%, #4752c4); border-color: rgba(255, 255, 255, 0.45);
    box-shadow: 0 0 0 6px rgba(88, 101, 242, 0.18), 0 0 48px rgba(88, 101, 242, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
  .dc:hover .logo::after { animation-play-state: paused; opacity: 0; }
  .dc:active .logo::before { transform: scale(0.9); }
  .dc .logo svg { position: relative; z-index: 1; }
  /* "open discord" hint that slides in under the name on hover */
  .dc .hint { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 10px; font-weight: 500;
    letter-spacing: 0.32em; text-transform: uppercase; color: rgba(255, 255, 255, 0.75);
    opacity: 0; transform: translateY(-6px); filter: blur(4px);
    transition: opacity 0.4s, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s; }
  .dc .hint svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2.2; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
  .dc:hover .hint, .dc:focus-visible .hint { opacity: 1; transform: none; filter: none; }
  .dc:hover .hint svg { transform: translate(2px, -2px); }
  /* letters do a little wave on hover */
  .dc:hover .name b { animation: wave 0.6s cubic-bezier(0.3, 0, 0.3, 1) calc(var(--i) * 0.05s); }
  @keyframes wave { 40% { transform: translateY(-5px); } }
  .dc .logo svg { width: 46px; height: 46px; fill: #fff; filter: drop-shadow(0 6px 28px rgba(0, 0, 0, 0.65));
    opacity: 0; translate: 0 18px; scale: 0.85; filter: blur(10px);
    transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1); }
  .ready .dc .logo svg { animation: logo 1.3s cubic-bezier(0.16, 1, 0.3, 1) 1.5s forwards; }
  @keyframes logo { to { opacity: 1; translate: 0 0; scale: 1; filter: drop-shadow(0 6px 28px rgba(0, 0, 0, 0.65)); } }
  .dc .name { position: relative; display: flex; margin-top: 2px; font-family: Unbounded, ui-sans-serif, system-ui, sans-serif;
    font-size: 15px; font-weight: 600; letter-spacing: 0.42em; padding-left: 0.42em; color: #fff;
    filter: drop-shadow(0 2px 12px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 18px rgba(255, 255, 255, 0.18)); transition: filter 0.4s; }
  .dc .name b { display: inline-block; overflow: hidden; font-weight: inherit; padding: 0.1em 0; }
  /* a thin line that draws itself under the name */
  .dc .name::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 0; height: 1px; translate: -50% 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85), transparent); }
  .ready .dc .name::after { animation: underline 1.2s cubic-bezier(0.16, 1, 0.3, 1) 2.45s forwards; }
  @keyframes underline { to { width: 120%; } }
  .dc:hover .name, .dc:focus-visible .name { filter: drop-shadow(0 2px 12px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 22px rgba(255, 255, 255, 0.45)); }
  .dc .name i { display: inline-block; font-style: normal; opacity: 0; transform: translateY(105%); filter: blur(6px); }
  .ready .dc .name i { animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: calc(1.95s + var(--i) * 0.07s); }
  @keyframes rise { to { opacity: 1; transform: none; filter: none; } }
  .dc:hover .logo svg, .dc:focus-visible .logo svg { transform: scale(1.1) rotate(-6deg); }
  .dc:focus-visible .logo { outline: 1px solid rgba(255, 255, 255, 0.6); outline-offset: 4px; }

  /* music: a small glass pill bottom-right; the slider slides open on hover */
  #vol { position: fixed; right: 18px; bottom: 16px; z-index: 8; display: flex; align-items: center; gap: 0;
    height: 40px; padding: 0 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.16); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.7); opacity: 0; transition: gap 0.4s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s; }
  .ready #vol { animation: fade 1s ease 2.6s forwards; }
  #vol[hidden] { display: none; }
  #vol:hover, #vol:focus-within { gap: 10px; background: rgba(255, 255, 255, 0.1); }
  #mute { display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 50%; background: none; cursor: pointer; padding: 0; }
  #mute:focus-visible, #volume:focus-visible { outline: 1px solid rgba(255, 255, 255, 0.7); outline-offset: 3px; }
  .eq { display: flex; align-items: flex-end; gap: 2.5px; height: 14px; }
  .eq i { width: 3px; height: 3px; border-radius: 2px; background: #fff; transition: height 0.3s; }
  .playing:not(.muted) .eq i { animation: eq 0.9s ease-in-out infinite; }
  .playing:not(.muted) .eq i:nth-child(2) { animation-delay: -0.3s; animation-duration: 0.7s; }
  .playing:not(.muted) .eq i:nth-child(3) { animation-delay: -0.6s; animation-duration: 1.1s; }
  .playing:not(.muted) .eq i:nth-child(4) { animation-delay: -0.15s; animation-duration: 0.8s; }
  @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 14px; } }
  .muted .eq i { opacity: 0.45; }
  #volume { -webkit-appearance: none; appearance: none; width: 0; height: 3px; margin: 0; border-radius: 3px; cursor: pointer; outline: none;
    background: linear-gradient(90deg, #fff var(--v, 50%), rgba(255, 255, 255, 0.22) var(--v, 50%)); opacity: 0;
    transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s; }
  #vol:hover #volume, #vol:focus-within #volume { width: 92px; opacity: 1; }
  #volume::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px rgba(255, 255, 255, 0.6); }
  #volume::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: #fff; }
  #vol .tip { position: absolute; right: 0; bottom: calc(100% + 8px); font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase;
    color: rgba(255, 255, 255, 0.7); white-space: nowrap; opacity: 0; transform: translateY(4px); transition: opacity 0.3s, transform 0.4s; pointer-events: none; }
  #vol.waiting .tip { opacity: 1; transform: none; }


  @media (prefers-reduced-motion: reduce) {
    .bar, .ready .bar { animation: none; transform: scaleY(0); }
    .dc .logo::before { opacity: 1; animation: none; }
    .dc .logo svg, .dc .name i, .ready .dc .logo svg, .ready .dc .name i { animation: none; opacity: 1; transform: none; translate: none; scale: none; filter: none; }
  }
</style>

  <script>
    (() => {
      // If the 3D scene can't load (old device, blocked CDN), start the intro over the plain background anyway.
      setTimeout(() => {
        if (window.__sceneOk) return;
        document.body.classList.add("ready");
        document.getElementById("cut").style.cssText = "opacity:0;transition:opacity 1.2s";
      }, 5000);

      // Music. Browsers only allow sound after the visitor clicks or presses a key, so it
      // starts on the first interaction and fades in. Volume and mute are remembered.
      const music = document.getElementById("music"), vol = document.getElementById("vol");
      const btn = document.getElementById("mute"), range = document.getElementById("volume");
      const store = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
      const read = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
      let level = Number(read("wizmn-volume") ?? 0.25), muted = read("wizmn-muted") === "1", fadeRaf = 0;   // default 25%
      const paint = () => {
        range.value = level;
        range.style.setProperty("--v", `${level * 100}%`);
        vol.classList.toggle("muted", muted);
        btn.setAttribute("aria-label", muted ? "Unmute music" : "Mute music");
      };
      // Fade with a plain timer (not animation frames), so it still finishes if the tab is in the background.
      const fadeTo = (target, ms = 1200) => {
        clearInterval(fadeRaf);
        const from = music.volume, t0 = performance.now();
        fadeRaf = setInterval(() => {
          const k = Math.min(1, (performance.now() - t0) / ms);
          music.volume = from + (target - from) * k * k * (3 - 2 * k);
          if (k >= 1) clearInterval(fadeRaf);
        }, 30);
      };
      const start = () => music.error ? Promise.resolve() : music.play().then(() => {
        vol.classList.add("playing");
        vol.classList.remove("waiting");
        fadeTo(muted ? 0 : level);
      }).catch(() => {});
      paint();
      music.volume = 0;
      music.addEventListener("canplay", () => {
        start().then(() => { if (music.paused) vol.classList.add("waiting"); });
      }, { once: true });
      // No music.mp3 yet: the control stays visible (it just has nothing to play).
      const firstTouch = (e) => {
        if (vol.contains(e.target)) return;               // the player's own buttons handle themselves
        ["pointerdown", "keydown"].forEach((ev) => removeEventListener(ev, firstTouch, true));
        if (music.paused && !muted) start();
      };
      ["pointerdown", "keydown"].forEach((ev) => addEventListener(ev, firstTouch, true));
      btn.addEventListener("click", () => {
        if (music.error) { muted = !muted; paint(); }
        else if (music.paused) { muted = false; paint(); start(); }
        else { muted = !muted; paint(); fadeTo(muted ? 0 : level, 500); }
        store("wizmn-muted", muted ? "1" : "0");
      });
      range.addEventListener("input", () => {
        level = Number(range.value);
        muted = level === 0;
        paint();
        clearInterval(fadeRaf);
        if (music.error) {} else if (music.paused) start(); else music.volume = level;
        store("wizmn-volume", String(level));
        store("wizmn-muted", muted ? "1" : "0");
      });

      // Magnetic logo: it drifts toward the mouse a little, then springs back.
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        const a = document.querySelector(".dc"), logo = a.querySelector(".logo");
        a.addEventListener("pointermove", (e) => {
          const r = logo.getBoundingClientRect();
          logo.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * 0.3}px, ${(e.clientY - r.top - r.height / 2) * 0.3}px)`;
        });
        a.addEventListener("pointerleave", () => { logo.style.transform = ""; });
      }
    })();
  </script>

  <script type="module">
    import * as THREE from "three";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
    import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
    import { RGBELoader } from "three/addons/loaders/RGBELoader.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

    // Real helicopter model: "US Army UH-60M Black Hawk low poly model" by Yi Tsung Lee (CC BY 4.0),
    // in the heli folder. If it's missing, the built-in helicopter is used instead.
    // If it shows up facing backwards or sideways, change HELI_TURN to Math.PI or Math.PI / 2.
    const HELI_URL = "heli/scene.gltf";
    const HELI_TURN = 0;

    // Count the files we wait for before the intro starts (sky, ground, helicopter).
    let pending = 3;
    const bootAt = performance.now();
    let onAllLoaded = () => {};
    const loaded = () => { if (--pending === 0) onAllLoaded(); };

    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const canvas = document.getElementById("gl");
    const cut = document.getElementById("cut");

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
    } catch {
      throw new Error("WebGL unavailable");
    }
    window.__sceneOk = true;
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, innerWidth < 700 ? 1.25 : 1.5));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    /* ---------------- world ---------------- */
    const scene = new THREE.Scene();
    const FOG = new THREE.Color("#4a545e");
    scene.fog = new THREE.Fog(FOG, 35, 185);
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 600);

    const sunDir = new THREE.Vector3(-0.8, 0.22, -0.45).normalize();

    // Dusk sky: dark above, grey haze at the horizon, warm glow where the sun went down.
    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(400, 32, 16),
      new THREE.ShaderMaterial({
        side: THREE.BackSide, depthWrite: false, fog: false,
        uniforms: {
          top: { value: new THREE.Color("#04070b") }, mid: { value: new THREE.Color("#161d25") },
          hor: { value: FOG }, sun: { value: new THREE.Color("#d07a3e") }, sunDir: { value: sunDir },
        },
        vertexShader: `varying vec3 vDir; void main(){ vec4 w = modelMatrix * vec4(position,1.); vDir = w.xyz - cameraPosition; gl_Position = projectionMatrix * viewMatrix * w; }`,
        fragmentShader: `uniform vec3 top, mid, hor, sun, sunDir; varying vec3 vDir;
          void main(){ vec3 d = normalize(vDir); float y = d.y;
            vec3 c = mix(hor, mid, smoothstep(-0.02, 0.14, y)); c = mix(c, top, smoothstep(0.14, 0.65, y));
            float s = max(dot(d, sunDir), 0.); c += sun * (pow(s, 6.) * 0.55 + pow(s, 60.) * 0.6) * smoothstep(0.45, -0.05, y);
            gl_FragColor = vec4(c, 1.); }`,
      })
    );
    scene.add(sky);

    const hemi = new THREE.HemisphereLight("#8da0b4", "#1a2118", 2.4);
    scene.add(hemi);
    const sunLight = new THREE.DirectionalLight("#ffb07a", 3.4);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(1024, 1024);
    Object.assign(sunLight.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 140 });
    sunLight.shadow.bias = -0.0008;
    scene.add(sunLight, sunLight.target);

    // Real sunset sky photo (Poly Haven, CC0). It also lights the scene, and we point the
    // sun light at the brightest spot in the photo so shadows match the sky.
    new RGBELoader().setDataType(THREE.FloatType).load("assets/kloppenheim_06_1k.hdr", (hdr) => {
      hdr.mapping = THREE.EquirectangularReflectionMapping;
      const { data, width, height } = hdr.image;
      let best = -1, bi = 0;
      const fog = [0, 0, 0];
      let fogN = 0;
      for (let y = 0; y < height; y++) {
        const v = 1 - (y + 0.5) / height;
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          const lum = data[i] * 0.2126 + data[i + 1] * 0.7152 + data[i + 2] * 0.0722;
          if (lum > best) { best = lum; bi = y * width + x; }

      }
      const u = ((bi % width) + 0.5) / width, v = 1 - (Math.floor(bi / width) + 0.5) / height;
      const lat = Math.max((v - 0.5) * Math.PI, 0.16), a = (u - 0.5) * Math.PI * 2;
      sunDir.set(Math.cos(a) * Math.cos(lat), Math.sin(lat), Math.sin(a) * Math.cos(lat)).normalize();

      const BG = 0.32;   // dim the sky photo for a dusk mood
      scene.background = hdr;
      scene.environment = hdr;
      scene.backgroundIntensity = BG;
      scene.environmentIntensity = 0.5;
      scene.fog.color.setRGB((fog[0] / fogN) * BG, (fog[1] / fogN) * BG, (fog[2] / fogN) * BG);

      scene.fog.far = 240;
      scene.remove(sky);

      sunLight.intensity = 2.2;

    }, undefined, loaded);

    /* ---------------- terrain: an endless valley ---------------- */
    const CH = 160, CW = 260;
    const valleyX = (z) => Math.sin(z * 0.006) * 30 + Math.sin(z * 0.017) * 8;
    const bumps = (x, z) =>
      Math.sin(x * 0.05 + z * 0.03) * 4 + Math.sin(x * 0.13 - z * 0.07) * 2 + Math.sin(x * 0.021 - z * 0.043) * 9 + Math.sin(x * 0.31 + z * 0.27) * 0.7;
    function groundY(x, z) {
      const d = Math.abs(x - valleyX(z));
      return -6 + bumps(x, z) * (0.3 + 0.7 * Math.min(1, d / 40)) + Math.pow(Math.min(d, 95), 1.35) * 0.18;
    }

    // Ground: a real aerial photo of grass and rock (Poly Haven, CC0), tiled every 40 units.
    const texLoader = new THREE.TextureLoader();
    const tile = (tex, srgb) => {
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(CW / 40, CH / 40);
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      if (srgb) tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    };
    const groundMat = new THREE.MeshStandardMaterial({
      color: "#a7ab98", roughness: 1,
      map: tile(texLoader.load("assets/aerial_grass_rock_diff_1k.jpg", loaded, undefined, loaded), true),
      normalMap: tile(texLoader.load("assets/aerial_grass_rock_nor_gl_1k.jpg")),
      normalScale: new THREE.Vector2(1.4, 1.4),
    });

    // Fir trees, built like real game trees: a trunk and dark core, wrapped in ~130 "branch cards"
    // (flat pictures of a needle branch with see-through gaps) that droop and spiral up the trunk.
    function paint(g, hex) {
      const c = new THREE.Color(hex), n = g.attributes.position.count, arr = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
      g.setAttribute("color", new THREE.BufferAttribute(arr, 3));
      return g;
    }
    function needleTexture() {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 256;
      const x = c.getContext("2d");
      x.lineCap = "round";
      // side twigs first, then needles along the main twig and the side twigs
      const twigs = [];
      for (let i = 0; i < 9; i++) {
        const t = 0.08 + i * 0.1, side = i % 2 ? -1 : 1;
        twigs.push([20 + t * 470, 128, 20 + t * 470 + 70 * (1 - t), 128 + side * (70 - t * 50)]);
      }
      const needles = (x0, y0, x1, y1, count, len) => {
        for (let k = 0; k < count; k++) {
          const f = Math.random(), px = x0 + (x1 - x0) * f, py = y0 + (y1 - y0) * f;
          const dir = Math.atan2(y1 - y0, x1 - x0) + (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random() * 0.7);
          const l = len * (1 - f * 0.45) * (0.6 + Math.random() * 0.6);
          const gch = 55 + Math.random() * 60;
          x.strokeStyle = `rgb(${(gch * 0.42) | 0},${gch | 0},${(gch * 0.5) | 0})`;
          x.lineWidth = 1.6 + Math.random() * 1.6;
          x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(dir) * l, py + Math.sin(dir) * l); x.stroke();
        }
      };
      x.strokeStyle = "#3b2c1f";
      for (const [a, b, cc, d] of twigs) { x.lineWidth = 2.5; x.beginPath(); x.moveTo(a, b); x.lineTo(cc, d); x.stroke(); }
      for (const [a, b, cc, d] of twigs) needles(a, b, cc, d, 110, 26);
      needles(0, 128, 500, 128, 520, 34);
      x.strokeStyle = "#3b2c1f"; x.lineWidth = 4;
      x.beginPath(); x.moveTo(0, 128); x.lineTo(495, 128); x.stroke();
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return tex;
    }
    function firGeometries() {
      const H = 9, cards = [];
      for (let lvl = 0; lvl < 19; lvl++) {
        const y = 1.5 + lvl * ((H - 1.9) / 19);
        const f = 1 - (y - 1.5) / (H - 1.5);              // 1 at the bottom, 0 at the top
        const len = 0.55 + f * 2.7;
        const n = lvl > 15 ? 4 : 6;
        for (let b = 0; b < n; b++) {
          const phi = (b / n) * Math.PI * 2 + lvl * 0.83 + Math.random() * 0.5;
          for (const flat of [false, true]) {
            const g = new THREE.PlaneGeometry(len, len * 0.62).translate(len / 2, 0, 0);
            if (flat) g.rotateX(Math.PI / 2);
            g.rotateZ(-0.22 - f * 0.3 - Math.random() * 0.1); // droop, more at the bottom
            g.rotateY(phi);
            g.translate(0, y, 0);
            cards.push(g);
          }
        }
      }
      const top = new THREE.PlaneGeometry(0.9, 1.6).translate(0, H - 0.2, 0);
      cards.push(top, top.clone().rotateY(Math.PI / 2));
      const foliage = mergeGeometries(cards);
      // "Fluffy" lighting: point every normal away from the middle of the tree, so it shades like a soft cone.
      const p = foliage.attributes.position, nr = foliage.attributes.normal, v = new THREE.Vector3();
      for (let i = 0; i < p.count; i++) {
        v.set(p.getX(i), (p.getY(i) - H * 0.45) * 0.5 + 0.6, p.getZ(i)).normalize();
        nr.setXYZ(i, v.x, v.y, v.z);
      }
      const solid = paint(new THREE.CylinderGeometry(0.12, 0.3, H * 0.92, 7).translate(0, H * 0.46, 0), "#3a2b20");   // just the trunk
      return { foliage, solid };
    }
    const fir = firGeometries();
    const foliageMat = new THREE.MeshStandardMaterial({ map: needleTexture(), alphaTest: 0.45, side: THREE.DoubleSide, roughness: 0.85 });
    const solidMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 });
    const TREES = 460;
    const dummy = new THREE.Object3D();
    const tint = new THREE.Color();

    function buildChunk(ch) {
      const pos = ch.ground.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) pos.setY(i, groundY(pos.getX(i), ch.zc + pos.getZ(i)));
      pos.needsUpdate = true;
      ch.ground.geometry.computeVertexNormals();
      ch.ground.position.z = ch.zc;
      for (let i = 0; i < TREES; i++) {
        const x = (Math.random() - 0.5) * CW * 0.92, z = ch.zc + (Math.random() - 0.5) * CH;
        const d = Math.abs(x - valleyX(z));
        const s = d < 21 ? 0 : 0.6 + Math.random() * 0.9;   // keep the flight path clear so the camera never clips a tree
        dummy.position.set(x, groundY(x, z) - 0.4, z);
        dummy.rotation.set((Math.random() - 0.5) * 0.12, Math.random() * 6, (Math.random() - 0.5) * 0.12);
        dummy.scale.set(s, s * (0.8 + Math.random() * 0.5), s);
        dummy.updateMatrix();
        const r = Math.random();
        tint.setRGB(0.7 + r * 0.45, 0.78 + r * 0.4, 0.68 + r * 0.32);
        for (const m of ch.trees) { m.setMatrixAt(i, dummy.matrix); m.setColorAt(i, tint); }
      }
      for (const m of ch.trees) { m.instanceMatrix.needsUpdate = true; m.instanceColor.needsUpdate = true; }
    }
    const chunks = [-1, 0, 1, 2].map((k) => {
      const g = new THREE.PlaneGeometry(CW, CH, 90, 56).rotateX(-Math.PI / 2);
      const ground = new THREE.Mesh(g, groundMat);
      ground.receiveShadow = true;
      const trees = [new THREE.InstancedMesh(fir.solid, solidMat, TREES), new THREE.InstancedMesh(fir.foliage, foliageMat, TREES)];
      for (const m of trees) { m.receiveShadow = true; m.frustumCulled = false; }
      scene.add(ground, ...trees);
      const ch = { zc: -k * CH, ground, trees };
      buildChunk(ch);
      return ch;
    });

    /* ---------------- the helicopter ---------------- */
    function hot(r, g, b) { return new THREE.MeshBasicMaterial({ color: new THREE.Color(r, g, b), toneMapped: false }); }
    function makeHeli() {
      const g = new THREE.Group();
      const shell = new THREE.Group();   // the built-in model; hidden if heli.glb loads
      g.add(shell);
      const OLIVE = "#454d3b";
      const plain = new THREE.MeshStandardMaterial({ color: OLIVE, roughness: 0.62, metalness: 0.25 });
      const dark = new THREE.MeshStandardMaterial({ color: "#1b1e20", roughness: 0.5, metalness: 0.55 });
      const add = (geo, mat, x, y, z, rx = 0, ry = 0, rz = 0, parent = shell) => {
        const m = new THREE.Mesh(geo, mat);
        m.position.set(x, y, z);
        m.rotation.set(rx, ry, rz);
        m.castShadow = true;
        parent.add(m);
        return m;
      };

      // Fuselage: a smooth hull lofted through cross-sections of a Black Hawk (nose at -z).
      // Each row: z, half width, top, bottom.
      const STATIONS = [
        [-3.4, 0.16, 0.02, -0.3], [-3.2, 0.52, 0.36, -0.58], [-2.9, 0.8, 0.76, -0.78], [-2.45, 0.95, 1.16, -0.88],
        [-1.9, 1.02, 1.33, -0.92], [-1.0, 1.05, 1.38, -0.94], [0.4, 1.05, 1.38, -0.94], [1.3, 0.98, 1.32, -0.86],
        [1.95, 0.8, 1.18, -0.55], [2.6, 0.52, 1.0, -0.12], [3.4, 0.32, 0.9, 0.22], [4.8, 0.22, 0.86, 0.42],
        [6.1, 0.17, 0.88, 0.54], [6.6, 0.08, 0.92, 0.66],
      ];
      const zC = new THREE.CatmullRomCurve3(STATIONS.map((s) => new THREE.Vector3(s[0], 0, 0)));
      const sC = new THREE.CatmullRomCurve3(STATIONS.map((s) => new THREE.Vector3(s[1], s[2], s[3])));
      const Z0 = STATIONS[0][0], Z1 = STATIONS[STATIONS.length - 1][0];
      const RINGS = 90, SEG = 48, verts = [], uvs = [], index = [];
      const se = (c, e) => Math.sign(c) * Math.pow(Math.abs(c), e);
      for (let i = 0; i < RINGS; i++) {
        const t = i / (RINGS - 1), z = zC.getPoint(t).x, s = sC.getPoint(t);
        const mid = (s.y + s.z) / 2, hh = (s.y - s.z) / 2;
        for (let j = 0; j <= SEG; j++) {
          const th = (j / SEG) * Math.PI * 2, c = Math.cos(th), sn = Math.sin(th);
          const e = sn < 0 ? 0.55 : 0.75;             // flatter belly, rounder roof

      }

      hull.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
      hull.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
      hull.setIndex(index);
      hull.computeVertexNormals();

      // Paint job on a canvas: olive drab with grime, panel lines, rivets, and dark glossy windows.
      // u goes around the body (0 = right side, 0.25 = roof, 0.5 = left side), v runs nose to tail.
      const TW = 1024, TH = 1024;
      const colorC = document.createElement("canvas"), roughC = document.createElement("canvas");
      colorC.width = roughC.width = TW; colorC.height = roughC.height = TH;
      const normC = document.createElement("canvas");
      normC.width = TW; normC.height = TH;
      const cx = colorC.getContext("2d"), rx = roughC.getContext("2d"), nx = normC.getContext("2d");
      // Tile a photo texture across the body: about 1.6 units per tile (the body is ~6.5 around, 10 long).
      const tileImg = (ctx, img) => {
        const tw = (TW / 6.5) * 1.6, th = (TH / 10) * 1.6;
        for (let y = 0; y < TH; y += th) for (let x = 0; x < TW; x += tw) ctx.drawImage(img, x, y, tw, th);
      };
      const paintSkin = (metal) => {
      if (metal) {
        tileImg(cx, metal.diff);
        cx.globalCompositeOperation = "multiply";      // pull the rusty green toward army olive drab
        cx.fillStyle = "#b3b99f"; cx.fillRect(0, 0, TW, TH);
        cx.globalCompositeOperation = "source-over";
        tileImg(rx, metal.rough);
        tileImg(nx, metal.nor);
      } else {
        cx.fillStyle = OLIVE; cx.fillRect(0, 0, TW, TH);
        rx.fillStyle = "#b4b4b4"; rx.fillRect(0, 0, TW, TH);
        nx.fillStyle = "rgb(128,128,255)"; nx.fillRect(0, 0, TW, TH);
      }
      for (let k = 0; k < 2600; k++) {                // grime and wear
        const a = Math.random() * 0.06;
        cx.fillStyle = Math.random() < 0.5 ? `rgba(0,0,0,${a})` : `rgba(160,170,140,${a * 0.6})`;
        cx.fillRect(Math.random() * TW, Math.random() * TH, 2 + Math.random() * 30, 2 + Math.random() * 14);
      }
      const V = (z) => (1 - (1 - (z - Z0) / (Z1 - Z0))) * TH;   // canvas row for a z position
      const U = (u) => u * TW;
      cx.strokeStyle = "rgba(10,12,8,0.55)"; cx.lineWidth = 1.5;
      for (const z of [-2.95, -1.75, -1.15, 0.55, 1.35, 2.1, 3.3, 4.6, 5.8]) { cx.beginPath(); cx.moveTo(0, V(z)); cx.lineTo(TW, V(z)); cx.stroke(); }
      for (const u of [0.18, 0.32, 0.68, 0.82]) { cx.beginPath(); cx.moveTo(U(u), V(-3)); cx.lineTo(U(u), V(2.2)); cx.stroke(); }
      cx.fillStyle = "rgba(20,22,16,0.5)";
      for (let z = -2.8; z < 6.3; z += 0.18) for (const u of [0.18, 0.32, 0.68, 0.82]) cx.fillRect(U(u) - 1, V(z) - 1, 2, 2);
      // sliding cabin doors (both sides)
      for (const [u0, u1] of [[0.0, 0.135], [0.365, 0.5], [0.865, 1.0], [0.5, 0.635]]) {
        cx.strokeStyle = "rgba(8,10,6,0.7)"; cx.lineWidth = 2;
        cx.strokeRect(U(u0), V(-1.2), U(u1) - U(u0), V(0.55) - V(-1.2));
      }
      const glassRect = (u0, u1, z0, z1, r = 10) => {
        for (const [ctx, col] of [[cx, "#0b1216"], [rx, "#141414"], [nx, "rgb(128,128,255)"]]) {   // windows: dark, glossy, perfectly smooth
          ctx.fillStyle = col;
          ctx.beginPath(); ctx.roundRect(U(u0), V(z0), U(u1) - U(u0), V(z1) - V(z0), r); ctx.fill();
        }
      };
      glassRect(0.135, 0.245, -3.0, -2.3); glassRect(0.255, 0.365, -3.0, -2.3);          // windscreen (2 panes)
      glassRect(0.04, 0.115, -2.55, -1.85); glassRect(0.385, 0.46, -2.55, -1.85);         // cockpit side doors
      glassRect(0.0, 0.035, -2.5, -1.95, 6); glassRect(0.965, 1.0, -2.5, -1.95, 6);       // (wraps around u = 0)
      glassRect(0.03, 0.105, -1.0, -0.55); glassRect(0.395, 0.47, -1.0, -0.55);          // cabin windows
      glassRect(0.03, 0.105, -0.25, 0.25); glassRect(0.395, 0.47, -0.25, 0.25);
      cx.fillStyle = "rgba(0,0,0,0.35)";                                                    // exhaust soot on the tail
      cx.fillRect(U(0.12), V(1.4), U(0.26), V(3.2) - V(1.4));
      };
      paintSkin(null);
      const mkTex = (c, srgb) => { const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
      const skinTex = [mkTex(colorC, true), mkTex(roughC), mkTex(normC)];
      const skin = new THREE.MeshStandardMaterial({
        map: skinTex[0], roughnessMap: skinTex[1], normalMap: skinTex[2], normalScale: new THREE.Vector2(1.3, 1.3),
        roughness: 1, metalness: 0.35,
      });
      add(hull, skin, 0, 0, 0);

      // Real painted-metal photos (Poly Haven "Green Metal Rust", CC0): repaint the body with them,
      // and put them on the engine housings, fin and tail wings too.
      pending++;
      const img = (name) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = `assets/green_metal_rust_${name}_1k.jpg`; });
      Promise.all([img("diff"), img("nor_gl"), img("rough")]).then(([diff, nor, rough]) => {
        paintSkin({ diff, nor, rough });
        for (const t of skinTex) t.needsUpdate = true;
        const rep = (image, srgb) => {
          const t = new THREE.Texture(image);
          t.wrapS = t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(1.5, 1.5);
          if (srgb) t.colorSpace = THREE.SRGBColorSpace;
          t.anisotropy = 8;
          t.needsUpdate = true;

        Object.assign(plain, { map: rep(diff, true), normalMap: rep(nor), roughnessMap: rep(rough), roughness: 1, metalness: 0.35 });

        plain.normalScale.set(1.3, 1.3);
        plain.needsUpdate = true;
      }).catch(() => {}).finally(loaded);

      // Engine cowlings, intakes, exhausts.
      for (const sx of [-1, 1]) {
        const cowl = add(new THREE.CapsuleGeometry(0.33, 1.9, 8, 16), plain, sx * 0.42, 1.5, 0.35, Math.PI / 2);
        cowl.scale.set(1, 1, 0.82);
        add(new THREE.CylinderGeometry(0.24, 0.27, 0.1, 16), dark, sx * 0.42, 1.5, -0.95, Math.PI / 2);
        add(new THREE.CylinderGeometry(0.17, 0.22, 0.55, 12), dark, sx * 0.62, 1.48, 1.55, Math.PI / 2, 0, sx * 0.5);
      }
      add(new THREE.BoxGeometry(0.9, 0.22, 2.4), plain, 0, 1.45, 0.4);                               // spine between engines

      // Tail fin (swept back) and stabilator, as smooth extruded shapes.
      const finShape = new THREE.Shape([new THREE.Vector2(0, 0), new THREE.Vector2(1.05, 0), new THREE.Vector2(1.75, 2.05), new THREE.Vector2(1.15, 2.1)]);
      const fin = new THREE.ExtrudeGeometry(finShape, { depth: 0.12, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.04, bevelSegments: 2 });
      fin.rotateY(-Math.PI / 2);
      add(fin, plain, 0.06, 0.8, 5.55);
      const stabShape = new THREE.Shape([new THREE.Vector2(-2.2, 0), new THREE.Vector2(2.2, 0), new THREE.Vector2(2.05, 0.6), new THREE.Vector2(-2.05, 0.6)]);
      const stab = new THREE.ExtrudeGeometry(stabShape, { depth: 0.05, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 1 });
      stab.rotateX(Math.PI / 2);
      add(stab, plain, 0, 0.82, 6.0);

      // Landing gear: two main wheels on angled struts, one tail wheel.
      for (const sx of [-1, 1]) {
        add(new THREE.CylinderGeometry(0.34, 0.34, 0.24, 20), dark, sx * 1.28, -1.05, -1.55, 0, 0, Math.PI / 2);
        add(new THREE.CylinderGeometry(0.06, 0.06, 0.75, 8), dark, sx * 1.08, -0.78, -1.55, 0, 0, sx * 0.9);
        add(new THREE.CylinderGeometry(0.05, 0.05, 0.9, 8), dark, sx * 1.15, -0.85, -1.2, 0.9, 0, sx * 0.5);
      }
      add(new THREE.CylinderGeometry(0.17, 0.17, 0.12, 14), dark, 0, 0.12, 5.0, 0, 0, Math.PI / 2);
      add(new THREE.CylinderGeometry(0.04, 0.04, 0.45, 6), dark, 0, 0.35, 5.0);

      // Main rotor: mast, hub and four long blades with twist.
      add(new THREE.CylinderGeometry(0.13, 0.18, 0.7, 12), dark, 0, 1.95, 0.1);
      const rotor = new THREE.Group();
      rotor.position.set(0, 2.33, 0.1);
      shell.add(rotor);
      add(new THREE.CylinderGeometry(0.42, 0.42, 0.16, 16), dark, 0, 0, 0, 0, 0, 0, rotor);
      for (let k = 0; k < 4; k++) {
        const arm = new THREE.Group();
        arm.rotation.y = (k * Math.PI) / 2;
        rotor.add(arm);
        const blade = new THREE.BoxGeometry(0.4, 0.04, 5.0, 1, 1, 10).translate(0, 0, 2.85);
        const bp = blade.attributes.position;                      // twist the blade along its length
        for (let i = 0; i < bp.count; i++) {
          const a = -0.12 + (bp.getZ(i) / 5.4) * 0.16, X = bp.getX(i), Y = bp.getY(i);

      }
      const disc = new THREE.Mesh(
        new THREE.CircleGeometry(5.4, 64).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: "#9aa4a8", transparent: true, opacity: 0.045, depthWrite: false })
      );
      disc.position.set(0, 2.33, 0.1);
      shell.add(disc);

      // Tail rotor on the right side of the fin.
      const tail = new THREE.Group();
      tail.position.set(0.24, 2.15, 6.95);
      shell.add(tail);
      add(new THREE.CylinderGeometry(0.1, 0.1, 0.14, 10), dark, 0, 0, 0, 0, 0, Math.PI / 2, tail);
      for (let k = 0; k < 4; k++) add(new THREE.BoxGeometry(0.03, 1.05, 0.14).translate(0, 0.53, 0), dark, 0.03, 0, 0, (k * Math.PI) / 2, 0, 0, tail);

      // Lights: red left, green right (stabilator tips), red beacon on top, white strobe on the fin.
      const bulb = new THREE.SphereGeometry(0.08, 8, 6);
      const lights = {
        left: add(bulb, hot(6, 0.4, 0.3), -2.2, 0.82, 6.3, 0, 0, 0, g),
        right: add(bulb, hot(0.3, 6, 0.8), 2.2, 0.82, 6.3, 0, 0, 0, g),
        beacon: add(bulb, hot(8, 0.5, 0.4), 0, 1.62, 1.75, 0, 0, 0, g),
        strobe: add(bulb, hot(9, 9, 9), 0, 2.92, 7.3, 0, 0, 0, g),
      };
      for (const m of Object.values(lights)) m.castShadow = false;

      // Searchlight under the nose + a soft visible beam.
      const lamp = new THREE.Object3D();
      lamp.position.set(0, -0.82, -2.35);
      g.add(lamp);
      add(new THREE.SphereGeometry(0.16, 10, 8), hot(8, 9, 8.5), 0, 0, 0, 0, 0, 0, lamp).castShadow = false;
      const aim = new THREE.Vector3(0, -15, -30);
      const spot = new THREE.SpotLight("#eafff4", 2600, 0, 0.26, 0.55, 1.6);
      spot.target.position.copy(aim);
      lamp.add(spot, spot.target);
      const L = aim.length(), R = L * Math.tan(0.26);
      const beamGeo = new THREE.ConeGeometry(R, L, 32, 1, true).translate(0, -L / 2, 0);
      const beam = new THREE.Mesh(
        beamGeo,
        new THREE.ShaderMaterial({
          transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
          vertexShader: `varying float vY; void main(){ vY = -position.y / ${L.toFixed(2)}; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
          fragmentShader: `varying float vY; void main(){ float a = pow(clamp(1. - vY, 0., 1.), 2.2) * 0.16; gl_FragColor = vec4(vec3(0.85, 1.0, 0.94) * a, a); }`,
        })
      );
      beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), aim.clone().normalize());
      lamp.add(beam);

      return { g, shell, rotor, tail, lights, lamp, spinners: [] };
    }
    const heli = makeHeli();
    scene.add(heli.g);

    // Swap in the real model if heli.glb is there. Any size or facing is fixed up automatically:
    // the long side becomes front-to-back, the heavier end (the cabin) becomes the nose,
    // and anything named rotor/blade/prop gets spun.
    new GLTFLoader().load(HELI_URL, (gltf) => {
      const model = gltf.scene;
      model.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
      const box = new THREE.Box3(), size = new THREE.Vector3(), mid = new THREE.Vector3();
      const measure = () => { model.updateMatrixWorld(true); box.setFromObject(model); box.getSize(size); box.getCenter(mid); };

      measure();
      if (size.x > size.z) model.rotation.y = Math.PI / 2;
      measure();
      const sum = new THREE.Vector3(), p = new THREE.Vector3();
      let n = 0;
      model.traverse((o) => {
        if (!o.isMesh) return;
        const pos = o.geometry.attributes.position;
        for (let i = 0; i < pos.count; i += 3) { sum.add(p.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld)); n++; }
      });
      if (n && sum.z / n > mid.z) model.rotation.y += Math.PI;   // nose must point to -z
      model.rotation.y += HELI_TURN;
      measure();
      model.scale.multiplyScalar(11 / Math.max(size.z, 1e-6));
      measure();
      model.position.sub(mid);
      measure();

      // Spin the rotors around their own centers.
      const holder = new THREE.Group();
      holder.add(model);
      holder.updateMatrixWorld(true);
      const found = [];
      model.traverse((o) => { if (/rotor|blade|prop|rotar|helice/i.test(o.name) && !found.some((f) => f !== o && isInside(o, f))) found.push(o); });
      function isInside(o, f) { let q = o.parent; while (q) { if (q === f) return true; q = q.parent; } return false; }
      let biggest = 0;
      const parts = found.map((o) => {
        const b = new THREE.Box3().setFromObject(o), s = b.getSize(new THREE.Vector3());
        const axis = s.x < s.y ? (s.x < s.z ? "x" : "z") : s.y < s.z ? "y" : "z";
        const pivot = new THREE.Object3D();
        b.getCenter(pivot.position);
        holder.add(pivot);
        pivot.updateMatrixWorld(true);
        pivot.attach(o);
        const span = Math.max(s.x, s.y, s.z);
        biggest = Math.max(biggest, span);
        return { pivot, axis, span };
      });
      heli.spinners = parts.map((q) => ({ pivot: q.pivot, axis: q.axis, speed: q.span >= biggest * 0.99 ? 27 : 44 }));
      const main = parts.find((q) => q.span >= biggest * 0.99);
      if (main) {                                   // a faint blurred disc where the main rotor spins
        const disc = new THREE.Mesh(
          new THREE.CircleGeometry(main.span / 2, 48).rotateX(-Math.PI / 2),
          new THREE.MeshBasicMaterial({ color: "#9aa4a8", transparent: true, opacity: 0.05, depthWrite: false })
        );
        disc.position.copy(main.pivot.position);
        holder.add(disc);
      }

      // Move the searchlight and blinking lights onto the new body.
      heli.lamp.position.set(0, box.min.y + 0.12, box.min.z + size.z * 0.1);   // just under the nose, outside the body
      heli.lights.beacon.position.set(0, box.max.y * 0.55, box.min.z + size.z * 0.4);
      heli.lights.strobe.position.set(0, box.max.y * 0.8, box.max.z * 0.95);
      heli.lights.left.visible = heli.lights.right.visible = false;

      heli.shell.visible = false;
      heli.g.add(holder);
      loaded();
    }, undefined, loaded);   // no heli.glb: keep the built-in helicopter
    const rig = new THREE.Object3D();   // follows the helicopter's position and heading (no tilt), for the camera
    scene.add(rig);

    /* ---------------- rain ---------------- */
    const RAIN = 1500;
    const drops = new Float32Array(RAIN * 3);
    const rainPos = new Float32Array(RAIN * 6);
    const rainGeo = new THREE.BufferGeometry();
    rainGeo.setAttribute("position", new THREE.BufferAttribute(rainPos, 3));
    const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color: "#a9bcb8", transparent: true, opacity: 0.13 }));
    rain.frustumCulled = false;
    scene.add(rain);
    const respawn = (i, cx, cy, cz, anyY) => {
      drops[i * 3] = cx + (Math.random() - 0.5) * 80;
      drops[i * 3 + 1] = anyY ? cy + (Math.random() - 0.5) * 50 : cy + 10 + Math.random() * 20;
      drops[i * 3 + 2] = cz + (Math.random() - 0.5) * 80;
    };

    /* ---------------- bloom ---------------- */
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    // Safety net: a pixel that is too bright (e.g. the searchlight right against shiny metal) or
    // invalid gets smeared into black squares by the glow effect. Clean every pixel first.
    composer.addPass(new ShaderPass({
      uniforms: { tDiffuse: { value: null } },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
      fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
        void main(){ vec4 c = texture2D(tDiffuse, vUv);
          if (any(isnan(c)) || any(isinf(c))) c = vec4(0., 0., 0., 1.);
          gl_FragColor = vec4(clamp(c.rgb, 0., 40.), 1.); }`,
    }));
    const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.55, 0.5, 0.92);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      composer.setSize(w, h);
      camera.aspect = w / h;
      camera.fov = w / h < 1 ? 64 : 42;
      camera.updateProjectionMatrix();
    }
    resize();
    addEventListener("resize", resize);

    let mx = 0, my = 0, tmx = 0, tmy = 0;
    addEventListener("pointermove", (e) => { tmx = (e.clientX / innerWidth) * 2 - 1; tmy = (e.clientY / innerHeight) * 2 - 1; }, { passive: true });

    /* ---------------- camera shots (like a game intro) ---------------- */
    // Offsets are relative to the helicopter: -z is ahead of it, +x is its right side.
    const V = (x, y, z) => new THREE.Vector3(x, y, z);
    // The camera looks a bit above the helicopter so it sits below the logo, not behind it.
    const SHOTS = [
      (s) => ({ pos: V(-16 + s * 0.8, 13, 18 - s), look: V(0, 3, -10) }),     // wide establishing
      (s) => ({ pos: V(15, 1.5, -7 + s * 1.7), look: V(0, 3.6, 0) }),         // side tracking
      (s) => ({ pos: V(10, 0.2, -16 + s * 0.7), look: V(0, 3, 0) }),          // low front three-quarter
      (s) => ({ pos: V(-6, -2.5, -34 + s * 3.4), look: V(0, 6.5, 0) }),       // it flies at the camera
      (s) => ({ pos: V(3, 3, 18 - s * 0.5), look: V(0, 4.2, -14) }),          // chase
    ];
    const SHOT_LEN = 8;

    /* ---------------- animate ---------------- */
    const SPEED = reduce ? 9 : 24;
    let heliZ = 0, alt = groundY(valleyX(0), 0) + 12, prevYaw = 0, roll = 0;
    // Add #shot=2 to the address to start on a specific camera angle (handy for checking).
    let shot = Number((location.hash.match(/shot=(\d)/) || [])[1] || 0) % SHOTS.length, shotT = 0, snap = true, t = 0;
    const camLook = new THREE.Vector3(), wantPos = new THREE.Vector3(), wantLook = new THREE.Vector3();
    for (let i = 0; i < RAIN; i++) respawn(i, 0, alt, 0, true);
    const clock = new THREE.Clock();
    let startedAt = 0, warmup = 0;

    function frame() {
      const dt = Math.min(clock.getDelta(), 0.05);
      t += dt;
      mx += (tmx - mx) * 0.03; my += (tmy - my) * 0.03;

      // Fly along the valley, banking into the turns.
      heliZ -= SPEED * dt;
      const x = valleyX(heliZ);
      const dx = valleyX(heliZ - 1) - x;
      const yaw = Math.atan2(-dx, 1);
      const yawRate = (yaw - prevYaw) / Math.max(dt, 1e-4);
      prevYaw = yaw;
      roll += (THREE.MathUtils.clamp(yawRate * 0.9, -0.4, 0.4) - roll) * Math.min(1, dt * 2);
      const ground = Math.max(groundY(x, heliZ), groundY(valleyX(heliZ - 25), heliZ - 25));
      alt += (ground + 12 + Math.sin(t * 0.6) * 1.2 - alt) * Math.min(1, dt * 1.5);
      heli.g.position.set(x + Math.sin(t * 0.9) * 0.3, alt, heliZ);
      heli.g.rotation.set(-0.11 + Math.sin(t * 0.7) * 0.02, yaw, roll + Math.sin(t * 1.1) * 0.02, "YXZ");
      heli.rotor.rotation.y += dt * 27;
      heli.tail.rotation.x += dt * 44;
      for (const sp of heli.spinners) sp.pivot.rotation[sp.axis] += dt * sp.speed;
      const L = heli.lights;
      // Blink by scaling (not hiding) so nothing new has to be prepared mid-animation.
      L.beacon.scale.setScalar(t % 1.3 < 0.12 ? 1 : 0.0001);
      L.strobe.scale.setScalar(t % 2.1 < 0.05 || (t % 2.1 > 0.16 && t % 2.1 < 0.21) ? 1 : 0.0001);

      rig.position.copy(heli.g.position);
      rig.rotation.set(0, yaw, 0);
      rig.updateMatrixWorld();

      // Move the ground pieces that fall behind to the front.
      for (const ch of chunks) {
        if (ch.zc - CH / 2 > heliZ + 70) { ch.zc -= chunks.length * CH; buildChunk(ch); }
      }

      // Sun + shadows follow the helicopter.
      sunLight.position.copy(heli.g.position).addScaledVector(sunDir, 80);
      sunLight.target.position.copy(heli.g.position);
      sky.position.copy(camera.position);

      // Camera: glide smoothly from one shot to the next (no cuts).
      if (!reduce) {
        shotT += dt;
        if (shotT > SHOT_LEN) { shotT = 0; shot = (shot + 1) % SHOTS.length; }
      }
      const s = SHOTS[shot](shotT);
      wantPos.copy(s.pos).add(V(mx * 1.6, -my * 0.9, 0));
      rig.localToWorld(wantPos);
      wantLook.copy(s.look);
      rig.localToWorld(wantLook);
      if (snap) { camera.position.copy(wantPos); camLook.copy(wantLook); snap = false; }
      else {
        // Slow and floaty right after a shot change, then it settles and tracks tightly.
        const ease = THREE.MathUtils.smoothstep(shotT, 0, 3);
        camera.position.lerp(wantPos, 1 - Math.exp(-dt * (0.9 + ease * 3)));
        camLook.lerp(wantLook, 1 - Math.exp(-dt * (1.4 + ease * 4.5)));
      }
      camera.position.y = Math.max(camera.position.y, groundY(camera.position.x, camera.position.z) + 1.5);
      camera.lookAt(camLook);
      // A touch of handheld shake, stronger close to the rotor.
      const shake = shot === 2 || shot === 3 ? 0.008 : 0.003;
      camera.rotation.z += Math.sin(t * 13) * shake + Math.sin(t * 21) * shake * 0.6;

      // Render a few warm-up frames behind the black screen first (the heavy one-time setup
      // happens here), then start the intro and fade in once. Real seconds, so slow devices never stay black.
      // Wait for the sky/ground/helicopter files too (max 6 s, so a slow connection still gets the intro).
      if (!startedAt && ++warmup >= 4 && (pending <= 0 || performance.now() - bootAt > 6000)) {
        startedAt = performance.now();
        document.body.classList.add("ready");
      }
      const real = startedAt ? (performance.now() - startedAt) / 1000 : 0;
      if (real < 2.6) cut.style.opacity = (1 - THREE.MathUtils.smoothstep(real, 0, 2.6)).toFixed(3);
      else if (cut.style.opacity !== "0") cut.style.opacity = "0";

      // Rain falls around the camera.
      const cp = camera.position;
      for (let i = 0; i < RAIN; i++) {
        const k = i * 3;
        drops[k + 1] -= 34 * dt;
        drops[k] += 4 * dt;
        if (drops[k + 1] < cp.y - 25 || Math.abs(drops[k] - cp.x) > 40 || Math.abs(drops[k + 2] - cp.z) > 40) respawn(i, cp.x, cp.y, cp.z, false);
        const j = i * 6;
        rainPos[j] = drops[k]; rainPos[j + 1] = drops[k + 1]; rainPos[j + 2] = drops[k + 2];
        rainPos[j + 3] = drops[k] - 0.15; rainPos[j + 4] = drops[k + 1] + 1.2; rainPos[j + 5] = drops[k + 2];
      }
      rainGeo.attributes.position.needsUpdate = true;

      composer.render();
    }
    renderer.compile(scene, camera);   // prepare every material up front instead of mid-animation
    onAllLoaded = () => { renderer.compile(scene, camera); warmup = 0; };   // again once the real assets are in
    renderer.setAnimationLoop(frame);
  </script>
</body>
</html>
