<section class="hero">
  <h1>Contact</h1>
</section>

<h3>WhatsApp</h3>
<button onclick="goWhatsApp()">Open Chat</button>
</div>

<div class="card">
<h3>Discord</h3>
<button onclick="goDiscord()">Join Server</button>
</div>

  <input name="email" placeholder="Your email">
  <input name="message" placeholder="Message">
  <button type="submit">Send</button>
</form>
</div>

</div>
