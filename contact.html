<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact - Wizmn Studios</title>

<meta property="og:title" content="Contact - Wizmn Studios">

<link rel="stylesheet" href="style.css">
<script src="main.js" defer></script>
</head>

<body>

<header class="nav">
  <div class="nav-inner">
    <a class="logo" href="index.html">Wizmn Studios</a>
  </div>
</header>

<main class="section">
  <h1 class="reveal">Contact</h1>

  <form action="https://formsubmit.co/youremail@gmail.com" method="POST" class="card">
    <input type="text" name="name" placeholder="Name" required>
    <input type="email" name="email" placeholder="Email" required>
    <textarea name="message" placeholder="Message" required></textarea>
    <button class="cta">Send</button>
  </form>
</main>

</body>
</html>
